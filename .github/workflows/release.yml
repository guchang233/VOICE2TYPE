name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the release (e.g. v0.1.2)"
        required: true
        default: v0.1.2

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 拉取完整历史与标签：后续 CHANGELOG 步骤需要 git describe/log 做标签间对比，
          # 默认 fetch-depth: 1 的浅克隆会导致 git describe/log 失败（v0.2.0 构建因此挂掉）
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Determine tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Build release binary
        working-directory: src-tauri
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Rename binary
        id: binary
        shell: bash
        run: |
          # 提取版本号（去掉 'v' 前缀，例如 v0.1.2 -> 0.1.2）
          VERSION="${{ steps.tag.outputs.name }}"
          VERSION="${VERSION#v}"
          # 源文件路径（cargo 输出的 exe 名称来自 Cargo.toml 的 [package].name）
          SRC="src-tauri/target/x86_64-pc-windows-msvc/release/voice2type.exe"
          # 目标文件名带版本号和架构
          DEST="Voice2Type_v${VERSION}_x86_64.exe"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> $GITHUB_OUTPUT
          echo "Created release binary: $DEST"
          ls -lh "$DEST"

      - name: Extract release notes from CHANGELOG
        shell: bash
        env:
          REL_TAG: ${{ steps.tag.outputs.name }}
        run: |
          export PYTHONIOENCODING=utf-8
          python << 'PYEOF'
          import re, os, subprocess, sys

          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass

          tag = os.environ["REL_TAG"]
          version = tag.lstrip("v")

          # 上一个 tag（用于生成版本对比链接）
          try:
              prev_tag = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0", tag + "^"],
                  text=True, encoding="utf-8", errors="replace"
              ).strip()
          except Exception:
              prev_tag = ""

          # 从 CHANGELOG.md 提取当前版本的章节作为发布描述，
          # 避免每个 Release 都是同一份写死的模板文本
          section = ""
          try:
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  content = f.read()
              m = re.search(
                  r"^##\s*\[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^##\s*\[|\Z)",
                  content,
                  re.MULTILINE | re.DOTALL,
              )
              if m:
                  section = m.group(1).strip()
          except Exception as e:
              print(f"read changelog failed: {e}")

          if not section:
              section = "（本版本未记录详细变更，请查看提交历史）"

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          lines = []
          lines.append(f"## 本版本变更（v{version}）")
          lines.append("")
          lines.append(section)
          lines.append("")
          lines.append("## 安装说明")
          lines.append("")
          lines.append("下载下方的 `Voice2Type_v*.exe` 文件即可直接运行，无需安装。")
          lines.append("")
          lines.append("**系统要求：**")
          lines.append("- Windows 10/11 (x86_64)")
          lines.append("- WebView2 运行时（Windows 11 已内置，Windows 10 可能需要安装）")
          if prev_tag and repo:
              lines.append("")
              lines.append(f"**Full Changelog**: https://github.com/{repo}/compare/{prev_tag}...{tag}")

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print(f"release notes written: section={len(section)} chars, prev_tag={prev_tag or '-'}")
          PYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Voice2Type ${{ steps.tag.outputs.name }}"
          # 发布描述取自 CHANGELOG.md 中当前版本的章节（上一步生成），每个版本各不相同；
          # 关闭自动生成的提交列表，避免与手写变更内容重复、风格不统一
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: ${{ steps.binary.outputs.path }}

      - name: Generate CHANGELOG entry
        shell: bash
        run: |
          export PYTHONIOENCODING=utf-8
          python << 'PYEOF'
          import subprocess, re, sys
          from datetime import datetime

          # 全程强制 UTF-8：Windows runner 默认 GBK 控制台/解码会使含中文的
          # git 输出与 print 报 Unicode 编解码错误（v0.2.1 构建因此失败）
          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          except Exception:
              pass

          def git_out(args):
              return subprocess.check_output(
                  args, text=True, encoding="utf-8", errors="replace"
              )

          tag = "${{ steps.tag.outputs.name }}"
          version = tag.lstrip("v")

          # 获取上一个 tag（脚本内输出均用 ASCII，避免控制台编码问题）
          try:
              prev_tag = git_out(["git", "describe", "--tags", "--abbrev=0", tag + "^"]).strip()
          except Exception:
              prev_tag = ""

          # 获取 commit 列表（历史不可用时降级为空列表，不阻断发布）
          commits = []
          try:
              rng = f"{prev_tag}..{tag}" if prev_tag else tag
              commits = git_out(["git", "log", rng, "--pretty=format:%s", "--no-merges"]).strip().split("\n")
          except Exception as e:
              print(f"commit list unavailable, degrade to empty: {e}")

          # 按 conventional commits 分类
          categories = {
              "feat": "新增", "fix": "修复", "perf": "性能",
              "refactor": "重构", "chore": "变更", "docs": "文档",
              "style": "样式", "test": "测试", "ci": "CI", "build": "构建",
          }
          grouped = {}
          for commit in commits:
              if not commit:
                  continue
              m = re.match(r"^(\w+)(\(.+?\))?!?:\s*(.+)$", commit)
              if m:
                  cat = categories.get(m.group(1).lower(), "其他")
                  grouped.setdefault(cat, []).append(m.group(3))
              else:
                  grouped.setdefault("其他", []).append(commit)

          # 生成 Markdown 条目
          today = datetime.now().strftime("%Y-%m-%d")
          lines = [f"## [{version}] - {today}", ""]
          for cat, descs in grouped.items():
              lines.append(f"### {cat}")
              for d in descs:
                  lines.append(f"- {d}")
              lines.append("")

          entry = "\n".join(lines)

          # 插入到 CHANGELOG.md（在第一个 "## [" 之前）；
          # 若仓库内已存在该版本的手写条目则跳过，避免重复章节（幂等）
          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              content = f.read()
          if f"## [{version}]" in content:
              print(f"CHANGELOG.md already has an entry for {version}, skip")
          else:
              parts = content.split("## [", 1)
              if len(parts) == 2:
                  new_content = parts[0] + entry + "## [" + parts[1]
              else:
                  new_content = content + "\n" + entry
              with open("CHANGELOG.md", "w", encoding="utf-8") as f:
                  f.write(new_content)
              print(f"Updated CHANGELOG.md for {version}")
          PYEOF

      - name: Update update.json for jsDelivr CDN
        shell: bash
        run: |
          VERSION="${{ steps.tag.outputs.name }}"
          VERSION_NOV="${VERSION#v}"
          # 获取刚创建的 release 信息（发布时间、body）
          RELEASE_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          PUBLISHED_AT=$(echo "$RELEASE_JSON" | jq -r '.published_at // ""')
          BODY=$(echo "$RELEASE_JSON" | jq -r '.body // ""')

          # 用 jq 安全构造 JSON（自动转义，避免 sed/tr 处理多行文本出错）
          ASSET_URL="https://github.com/guchang233/VOICE2TYPE/releases/download/${VERSION}/Voice2Type_v${VERSION_NOV}_x86_64.exe"
          jq -n \
            --arg tag "$VERSION" \
            --arg name "Voice2Type ${VERSION}" \
            --arg body "$BODY" \
            --arg published "$PUBLISHED_AT" \
            --arg asset_name "Voice2Type_v${VERSION_NOV}_x86_64.exe" \
            --arg asset_url "$ASSET_URL" \
            '{
              tag_name: $tag,
              name: $name,
              body: $body,
              prerelease: false,
              draft: false,
              published_at: $published,
              assets: [ { name: $asset_name, browser_download_url: $asset_url } ]
            }' > update.json

          # 提交到仓库（触发 jsDelivr CDN 缓存更新）。
          # tag 触发时 checkout 处于 detached HEAD，且 main 可能已领先于 tag
          # （如标签推送后又有新提交推上主干），直接 HEAD:main 会因非快进被拒。
          # 故：先保存产物 → 切到最新 main → 恢复产物 → 提交推送。
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp update.json /tmp/update.json.new
          CHANGED_CHANGELOG=0
          if ! git diff --quiet -- CHANGELOG.md; then
            CHANGED_CHANGELOG=1
            cp CHANGELOG.md /tmp/CHANGELOG.md.new
          fi
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/update.json.new update.json
          if [ "$CHANGED_CHANGELOG" = "1" ]; then
            cp /tmp/CHANGELOG.md.new CHANGELOG.md
          fi
          git add update.json CHANGELOG.md
          git commit -m "chore: update update.json and CHANGELOG for ${VERSION}" || echo "No changes to commit"
          git push origin main
